<title>Speaking Test — Random Question</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {

    font-weight: 600;

    cursor: pointer;

  }
  .btn-random:hover {
    transform: translateY(-2px);

  }
  .btn-random:active { transform: translateY(0); }
  .btn-random:disabled {
    opacity: 0.45;
    cursor: not-allowed;
    transform: none;
    box-shadow: none;
  }

  /* ── Card ── */
  .card {
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 1rem;
    padding: 2rem;
    opacity: 0;
    transform: translateY(10px);
    transition: opacity 0.35s ease, transform 0.35s ease;
  }
  .card.visible {
    opacity: 1;
    transform: translateY(0);
  }

  .card .topic-badge {
    display: inline-block;
    font-size: 0.75rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;

  }

    color: #f8fafc;
    line-height: 1.4;
    margin-bottom: 1.25rem;
  }

  .card .subtitle-label {
    font-size: 0.8rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: #64748b;
    margin-bottom: 0.5rem;

    display: flex;
    flex-direction: column;
    gap: 0.5rem;
  }
  .card .sub-questions li {
    display: flex;
    gap: 0.5rem;
    font-size: 0.95rem;
    color: #cbd5e1;
    line-height: 1.45;
  }
  .card .sub-questions li .dot {
    color: #818cf8;
    flex-shrink: 0;
  }

  .timers {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1.25rem;
    margin-top: 1.75rem;
  }

    background: #0f172a;

    padding: 1rem 0.75rem;
    text-align: center;

  .timer-box.warning { border-color: #f59e0b; }
  .timer-box.danger { border-color: #ef4444; }

    font-size: 0.75rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: #64748b;
    margin-bottom: 0.35rem;

  .timer-box.warning .timer-display { color: #f59e0b; }

  .timer-box.done .timer-status { color: #22c55e; }
  .timer-box.warning .timer-status { color: #f59e0b; }
  .timer-box.danger .timer-status { color: #ef4444; }

    gap: 0.4rem;
    justify-content: center;
    margin-top: 0.5rem;

  .timer-controls button {
    font-size: 0.72rem;
    font-weight: 600;
    padding: 0.3rem 0.8rem;

    border: 1px solid #475569;

  </div>
</div>

  resetAnswer();

  // Reset usedIndices if all questions have been shown
  if (usedIndices.length >= questions.length) {
    usedIndices = [];
  }

  // Build available pool
  const available = [];
  for (let i = 0; i < questions.length; i++) {
    if (!usedIndices.includes(i)) available.push(i);
  }

  const idx = available[Math.floor(Math.random() * available.length)];
  usedIndices.push(idx);
  currentQuestion = questions[idx];

  // Render
  topicBadge.textContent = currentQuestion.topic;
  questionNumber.textContent = `Question #${currentQuestion.id} of 20`;
  questionEl.textContent = currentQuestion.question;

  subQuestions.innerHTML = '';
  currentQuestion.subs.forEach(s => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="dot">▸</span><span>${s}</span>`;
    subQuestions.appendChild(li);
  });

  // Show card, hide placeholder
  placeholder.style.display = 'none';
  card.classList.add('visible');

  // Show timers but reset their state
  prepTimerBox.className = 'timer-box';
  answerTimerBox.className = 'timer-box';
}

// ═══════════════════════════════════════
//  Preparation Timer
// ═══════════════════════════════════════
function startPrep() {
  if (prepRunning) return;
  // Stop answer timer if running
  if (answerRunning) stopAnswer();

  prepRunning = true;
  prepStartBtn.textContent = '⏸ Pause';
  prepStartBtn.classList.remove('primary');
  prepStatus.textContent = 'PREPARING...';

  prepInterval = setInterval(() => {
    prepSecondsLeft--;
    updatePrepDisplay();

    if (prepSecondsLeft <= 0) {
      stopPrep();
      prepStatus.textContent = 'TIME\'S UP!';
      prepTimerBox.className = 'timer-box done';
      // Auto-start answer timer
      startAnswer();
    }
  }, 1000);
}

function stopPrep() {
  if (prepInterval) clearInterval(prepInterval);
  prepInterval = null;
  prepRunning = false;
  prepStartBtn.textContent = 'Start';
  prepStartBtn.classList.add('primary');
}

function resetPrep() {
  stopPrep();
  prepSecondsLeft = PREP_SECONDS;
  updatePrepDisplay();
  prepStatus.textContent = 'READY';
  prepTimerBox.className = 'timer-box';
}

function updatePrepDisplay() {
  const m = Math.floor(Math.max(0, prepSecondsLeft) / 60);
  const s = Math.max(0, prepSecondsLeft) % 60;
  prepDisplay.textContent = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;

  prepTimerBox.classList.remove('active', 'warning', 'danger', 'done');
  if (prepRunning) {
    prepTimerBox.classList.add('active');
    if (prepSecondsLeft <= 5) prepTimerBox.classList.add('danger');
    else if (prepSecondsLeft <= 10) prepTimerBox.classList.add('warning');
  }
}

// ═══════════════════════════════════════
//  Answer Timer
// ═══════════════════════════════════════
function startAnswer() {
  if (answerRunning) return;
  // Stop prep timer if running
  if (prepRunning) stopPrep();

  answerRunning = true;
  answerStartBtn.textContent = '⏸ Pause';
  answerStartBtn.classList.remove('primary');
  answerStatus.textContent = 'ANSWERING...';

  answerInterval = setInterval(() => {
    answerSecondsLeft--;
    updateAnswerDisplay();

    if (answerSecondsLeft <= 0) {
      stopAnswer();
      answerStatus.textContent = 'TIME\'S UP!';
      answerTimerBox.className = 'timer-box done';
    }
  }, 1000);
}

function stopAnswer() {
  if (answerInterval) clearInterval(answerInterval);
  answerInterval = null;
  answerRunning = false;
  answerStartBtn.textContent = 'Start';
  answerStartBtn.classList.add('primary');
}

function resetAnswer() {
  stopAnswer();
  answerSecondsLeft = ANSWER_SECONDS;
  updateAnswerDisplay();
  answerStatus.textContent = 'READY';
  answerTimerBox.className = 'timer-box';
}

function updateAnswerDisplay() {
  const m = Math.floor(Math.max(0, answerSecondsLeft) / 60);
  const s = Math.max(0, answerSecondsLeft) % 60;
  answerDisplay.textContent = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;

  answerTimerBox.classList.remove('active', 'warning', 'danger', 'done');
  if (answerRunning) {
    answerTimerBox.classList.add('active');
    if (answerSecondsLeft <= 10) answerTimerBox.classList.add('danger');
    else if (answerSecondsLeft <= 20) answerTimerBox.classList.add('warning');
  }
}

// ═══════════════════════════════════════
//  Keyboard shortcuts
// ═══════════════════════════════════════
document.addEventListener('keydown', (e) => {
  if (e.key === ' ' || e.code === 'Space') {
    e.preventDefault();
    // Space toggles prep timer
    if (prepRunning) {
      stopPrep();
      prepStatus.textContent = 'PAUSED';
    } else if (!answerRunning) {
      startPrep();
    }
  }
  if (e.key === 'Enter') {
    e.preventDefault();
    // Enter toggles answer timer
    if (answerRunning) {
      stopAnswer();
      answerStatus.textContent = 'PAUSED';
    } else {
      startAnswer();
    }
  }
  if (e.key === 'r' || e.key === 'R') {
    e.preventDefault();
    pickRandom();
  }
});
</script>
